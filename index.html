<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViewBoost AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d1d;
  color:white;
  padding:25px;
}
.container{
  max-width:600px;
  margin:auto;
}
h1{
  text-align:center;
  font-size:38px;
}
.subtitle{
  text-align:center;
  color:#aeb8d6;
  font-size:20px;
  margin-bottom:30px;
}
.card{
  background:#151c35;
  border:1px solid #303b66;
  border-radius:22px;
  padding:22px;
  margin-bottom:20px;
}
label{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin:18px 0 8px;
}
input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border-radius:14px;
  border:1px solid #3b4770;
  background:#0d1328;
  color:white;
  font-size:17px;
}
textarea{
  min-height:120px;
}
button{
  width:100%;
  margin-top:25px;
  padding:18px;
  border:0;
  border-radius:15px;
  background:linear-gradient(90deg,#2878ff,#7a3cff);
  color:white;
  font-size:21px;
  font-weight:bold;
}
.result{
  display:none;
}
.box{
  background:#0c1328;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
  line-height:1.5;
}
.title{
  color:#70a7ff;
  font-size:20px;
  font-weight:bold;
}
.copy{
  background:#26345d;
  font-size:15px;
  padding:10px;
  margin-top:12px;
}
.note{
  text-align:center;
  color:#9da8c8;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 ViewBoost AI</h1>
<div class="subtitle">Real Content Growth Assistant</div>

<div class="card">

<label>🎬 What is your video about?</label>
<textarea id="topic"
placeholder="Example: How to check engine problems"></textarea>

<label>🎯 Your niche</label>
<select id="niche">
<option>Automotive</option>
<option>Technology</option>
<option>Beauty</option>
<option>Fitness</option>
<option>Food</option>
<option>Gaming</option>
<option>Business</option>
</select>

<label>📱 Platform</label>
<select id="platform">
<option>Facebook Reels</option>
<option>YouTube Shorts</option>
<option>TikTok</option>
</select>

<button onclick="boost()">🚀 CREATE VIRAL CONTENT</button>

</div>

<div class="card result" id="result">

<h2>🔥 Your Viral Content Package</h2>

<div class="box">
<div class="title">🪝 HOOK</div>
<p id="hook"></p>
<button class="copy" onclick="copyText('hook')">Copy Hook</button>
</div>

<div class="box">
<div class="title">🎬 VIDEO SCRIPT</div>
<p id="script"></p>
<button class="copy" onclick="copyText('script')">Copy Script</button>
</div>

<div class="box">
<div class="title">📝 CAPTION</div>
<p id="caption"></p>
<button class="copy" onclick="copyText('caption')">Copy Caption</button>
</div>

<div class="box">
<div class="title">#️⃣ HASHTAGS</div>
<p id="hashtags"></p>
<button class="copy" onclick="copyText('hashtags')">Copy Hashtags</button>
</div>

<div class="box">
<div class="title">📈 GROWTH PLAN</div>
<p id="plan"></p>
</div>

</div>

<div class="note">
ViewBoost AI • Built for real viewers, not fake views.
</div>

</div>

<script>

function boost(){

let topic=document.getElementById("topic").value.trim();
let niche=document.getElementById("niche").value;
let platform=document.getElementById("platform").value;

if(!topic){
alert("Enter your video topic first.");
return;
}

document.getElementById("result").style.display="block";

let hook="🚨 STOP! Before you "+topic.toLowerCase()+", watch this first!";

let script=
"HOOK: "+hook+
"\\n\\n"+
"STEP 1: Show the problem immediately.\\n"+
"STEP 2: Demonstrate the correct way to check it.\\n"+
"STEP 3: Show the result clearly.\\n"+
"STEP 4: Give one important tip viewers can use today.\\n\\n"+
"ENDING: Follow for more "+niche+" tips and share this with someone who needs it.";

let caption=
"🔥 "+topic+
"\\n\\n"+
"Most people make this mistake without knowing it. "+
"Watch until the end and save this for later. "+
"Follow for more "+niche+" tips!";

let hashtags=
"#"+niche.replace(/\\s/g,"")+
" #"+platform.replace(/\\s/g,"")+
" #ViralReels #Trending #Tips #HowTo #MustWatch #ForYou";

let plan=
"1️⃣ Keep the video 15–35 seconds.\\n"+
"2️⃣ Show the result/problem in the first 2 seconds.\\n"+
"3️⃣ Remove long introductions.\\n"+
"4️⃣ Add captions on screen.\\n"+
"5️⃣ Test 3 different hooks for the same topic.\\n"+
"6️⃣ Post consistently and study retention, shares and comments.\\n\\n"+
"⚠️ 1M views cannot be guaranteed. This tool optimizes the content for real audience growth.";

document.getElementById("hook").innerText=hook;
document.getElementById("script").innerText=script;
document.getElementById("caption").innerText=caption;
document.getElementById("hashtags").innerText=hashtags;
document.getElementById("plan").innerText=plan;

document.getElementById("result").scrollIntoView({
behavior:"smooth"
});

}

function copyText(id){
let text=document.getElementById(id).innerText;
navigator.clipboard.writeText(text);
alert("Copied!");
}

</script>

</body>
</html>
