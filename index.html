<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViewBoost AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:25px 16px 50px;
 font-family:Arial,sans-serif;
 background:#080d1d;
 color:#fff;
}
.container{max-width:650px;margin:auto}
h1{text-align:center;font-size:40px;margin:15px 0 5px}
.subtitle{text-align:center;color:#aeb8d6;font-size:19px;margin-bottom:28px}
.card{
 background:#151c35;
 border:1px solid #303b66;
 border-radius:24px;
 padding:24px;
 margin-bottom:20px;
}
label{
 display:block;
 font-size:18px;
 font-weight:bold;
 margin:18px 0 9px
}
textarea,input,select{
 width:100%;
 border:1px solid #3b4770;
 border-radius:15px;
 background:#0c1226;
 color:white;
 padding:16px;
 font-size:17px;
 outline:none;
}
textarea{min-height:115px;resize:vertical}
button{
 width:100%;
 border:0;
 border-radius:16px;
 padding:18px;
 margin-top:22px;
 background:linear-gradient(90deg,#2878ff,#793cff);
 color:white;
 font-size:20px;
 font-weight:bold;
}
button:active{transform:scale(.98)}
.result{display:none}
.section{
 background:#0c1328;
 border-radius:17px;
 padding:18px;
 margin-top:15px;
}
.section h3{
 margin:0 0 10px;
 color:#75a9ff;
 font-size:20px
}
.section p{
 margin:0;
 white-space:pre-line;
 line-height:1.55;
 font-size:16px
}
.copy{
 width:auto;
 margin-top:13px;
 padding:9px 15px;
 background:#27355d;
 font-size:14px;
}
.badge{
 display:inline-block;
 background:#182a50;
 color:#82b2ff;
 border-radius:20px;
 padding:7px 12px;
 margin-bottom:10px;
 font-size:13px
}
.footer{text-align:center;color:#8f9ab9;margin-top:25px}
</style>
</head>

<body>

<div class="container">

<h1>🚀 ViewBoost AI</h1>
<div class="subtitle">AI Viral Content Engine</div>

<div class="card">

<label>🎬 What is your video about?</label>
<textarea id="topic"
placeholder="Example: How to diagnose a check engine light"></textarea>

<label>🎯 Your niche</label>
<select id="niche">
<option>Automotive</option>
<option>Technology</option>
<option>Beauty</option>
<option>Fitness</option>
<option>Food</option>
<option>Gaming</option>
<option>Business</option>
<option>General</option>
</select>

<label>📱 Platform</label>
<select id="platform">
<option>Facebook Reels</option>
<option>TikTok</option>
<option>YouTube Shorts</option>
</select>

<label>⏱️ Video length</label>
<select id="length">
<option>15 seconds</option>
<option>30 seconds</option>
<option>60 seconds</option>
</select>

<button onclick="generate()">🚀 VIRAL BOOST</button>

</div>

<div class="card result" id="result">

<div class="badge">AI CONTENT PACKAGE</div>
<h2>🔥 Your Viral Strategy</h2>

<div class="section">
<h3>🪝 HOOK 1</h3>
<p id="hook1"></p>
<button class="copy" onclick="copy('hook1')">Copy</button>
</div>

<div class="section">
<h3>🪝 HOOK 2</h3>
<p id="hook2"></p>
<button class="copy" onclick="copy('hook2')">Copy</button>
</div>

<div class="section">
<h3>🪝 HOOK 3</h3>
<p id="hook3"></p>
<button class="copy" onclick="copy('hook3')">Copy</button>
</div>

<div class="section">
<h3>🎬 VIDEO SCRIPT</h3>
<p id="script"></p>
<button class="copy" onclick="copy('script')">Copy</button>
</div>

<div class="section">
<h3>📝 CAPTION</h3>
<p id="caption"></p>
<button class="copy" onclick="copy('caption')">Copy</button>
</div>

<div class="section">
<h3>#️⃣ HASHTAGS</h3>
<p id="hashtags"></p>
<button class="copy" onclick="copy('hashtags')">Copy</button>
</div>

<div class="section">
<h3>💬 PINNED COMMENT</h3>
<p id="comment"></p>
<button class="copy" onclick="copy('comment')">Copy</button>
</div>

<div class="section">
<h3>🖼️ THUMBNAIL TEXT</h3>
<p id="thumbnail"></p>
<button class="copy" onclick="copy('thumbnail')">Copy</button>
</div>

<div class="section">
<h3>🎯 CTA</h3>
<p id="cta"></p>
<button class="copy" onclick="copy('cta')">Copy</button>
</div>

<div class="section">
<h3>📈 GROWTH PLAN</h3>
<p id="plan"></p>
</div>

</div>

<div class="footer">
ViewBoost AI • Optimize for real viewers
</div>

</div>

<script>

function generate(){

const topic=document.getElementById("topic").value.trim();
const niche=document.getElementById("niche").value;
const platform=document.getElementById("platform").value;
const length=document.getElementById("length").value;

if(!topic){
 alert("Enter your video topic first.");
 return;
}

const hooks=[
"🚨 STOP! If you have a problem with "+topic.toLowerCase()+", watch this before doing anything.",
"⚠️ Most people get this wrong! Here's the correct way to "+topic.toLowerCase()+".",
"🔥 Before you spend money fixing this, check THIS first!"
];

const script=
"HOOK:\n"+
hooks[0]+
"\n\n"+
"0–3 SEC:\nShow the problem immediately. No long introduction.\n\n"+
"3–10 SEC:\nExplain the first thing viewers should check.\n\n"+
"10–20 SEC:\nDemonstrate the correct procedure clearly.\n\n"+
"20–27 SEC:\nShow the result and explain what it means.\n\n"+
"ENDING:\nGive one final useful tip and ask viewers a question.\n\n"+
"VIDEO LENGTH: "+length;

const caption=
"🔥 "+topic+
"\n\n"+
"Don't guess—check it properly first. "+
"Save this video so you can use it later.\n\n"+
"👇 What would you check first?\n"+
"Follow for more "+niche+" tips!";

const hashtags=
"#"+clean(niche)+
" #"+clean(platform)+
" #AutomotiveTips #HowTo #CarTips #MechanicTips "+
"#FacebookReels #ViralReels #Trending #MustWatch";

const comment=
"👇 What would YOU check first?\n"+
"Comment your answer below. I might feature the best answer in the next video!";

const thumbnail=
"STOP! CHECK THIS FIRST";

const cta=
"👉 Follow for more practical "+niche+
" tips.\n👉 Save this video.\n👉 Share it with someone who needs it.";

const plan=
"🔥 POSTING PLAN\n\n"+
"1. Put the strongest visual in the first 1–2 seconds.\n"+
"2. Keep cuts fast and remove unnecessary pauses.\n"+
"3. Add large on-screen captions.\n"+
"4. End with a question to encourage comments.\n"+
"5. Test all 3 hooks using the same topic.\n"+
"6. Track watch time, retention, shares and comments.\n"+
"7. Make another video from the question people ask most.\n\n"+
"⚠️ No tool can guarantee 1M real views. The goal is to maximize the chance of reaching real viewers.";

document.getElementById("hook1").innerText=hooks[0];
document.getElementById("hook2").innerText=hooks[1];
document.getElementById("hook3").innerText=hooks[2];
document.getElementById("script").innerText=script;
document.getElementById("caption").innerText=caption;
document.getElementById("hashtags").innerText=hashtags;
document.getElementById("comment").innerText=comment;
document.getElementById("thumbnail").innerText=thumbnail;
document.getElementById("cta").innerText=cta;
document.getElementById("plan").innerText=plan;

document.getElementById("result").style.display="block";

setTimeout(()=>{
 document.getElementById("result").scrollIntoView({
  behavior:"smooth",
  block:"start"
 });
},100);

}

function clean(text){
 return text.replace(/[^a-zA-Z0-9]/g,"");
}

function copy(id){
 const text=document.getElementById(id).innerText;

 if(navigator.clipboard){
  navigator.clipboard.writeText(text).then(()=>{
   alert("✅ Copied!");
  });
 }else{
  alert("Select and copy the text.");
 }
}

</script>

</body>
</html>
