<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViewBoost AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#050817;
 color:#fff;
}

.app{
 max-width:620px;
 margin:auto;
 padding:25px 18px 60px;
}

.header{
 text-align:center;
 padding:25px 0 30px;
}

.logo{
 font-size:42px;
 font-weight:900;
}

.sub{
 color:#9da9c9;
 font-size:18px;
 margin-top:8px;
}

.card{
 background:linear-gradient(145deg,#171e38,#0d1328);
 border:1px solid #34436f;
 border-radius:28px;
 padding:24px;
 box-shadow:0 20px 60px rgba(0,0,0,.45);
}

label{
 display:block;
 font-weight:bold;
 font-size:18px;
 margin:12px 0 10px;
}

textarea,select{
 width:100%;
 background:#080d20;
 color:#fff;
 border:1px solid #394873;
 border-radius:15px;
 padding:16px;
 font-size:17px;
 outline:none;
}

textarea{
 height:95px;
 resize:none;
}

select{
 height:55px;
}

.targetTitle{
 text-align:center;
 color:#aab5d3;
 margin-top:25px;
}

.target{
 text-align:center;
 font-size:55px;
 font-weight:900;
 margin:5px 0 20px;
}

.boost{
 width:100%;
 border:0;
 border-radius:17px;
 padding:19px;
 background:linear-gradient(90deg,#246bfd,#754cff);
 color:#fff;
 font-size:22px;
 font-weight:900;
 box-shadow:0 8px 30px rgba(55,105,255,.35);
}

.boost:active{
 transform:scale(.97);
}

.dashboard{
 display:none;
 margin-top:22px;
}

.status{
 text-align:center;
 font-size:18px;
 color:#8fb0ff;
 margin-bottom:10px;
}

.counter{
 text-align:center;
 font-size:58px;
 font-weight:900;
 letter-spacing:-2px;
 margin:5px 0;
}

.viewsLabel{
 text-align:center;
 color:#9da9c9;
}

.bar{
 height:20px;
 background:#070b19;
 border-radius:20px;
 margin:22px 0 8px;
 overflow:hidden;
 border:1px solid #29365d;
}

.fill{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#2575ff,#a34cff);
 transition:.15s;
}

.percent{
 text-align:center;
 color:#aab5d3;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin-top:22px;
}

.stat{
 background:#080d20;
 border:1px solid #29365d;
 border-radius:16px;
 padding:18px 10px;
 text-align:center;
}

.num{
 font-size:25px;
 font-weight:bold;
}

.small{
 color:#8e9abb;
 font-size:13px;
 margin-top:5px;
}

.complete{
 display:none;
 text-align:center;
 margin-top:25px;
 padding:20px;
 border-radius:18px;
 background:#102b22;
 border:1px solid #28d391;
}

.complete h2{
 color:#35e6a0;
 margin:0 0 8px;
}

.reset{
 width:100%;
 margin-top:15px;
 padding:14px;
 border-radius:14px;
 border:1px solid #3b4b78;
 background:transparent;
 color:#fff;
 font-size:16px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
 <div class="logo">🚀 ViewBoost AI</div>
 <div class="sub">Viral Content Booster</div>
</div>

<div class="card">

<label>🎬 What is your video about?</label>

<textarea id="topic"
placeholder="Example: How to diagnose engine problems"></textarea>

<label>🎯 Your niche</label>

<select id="niche">
 <option>Automotive</option>
 <option>Technology</option>
 <option>Gaming</option>
 <option>Beauty</option>
 <option>Fitness</option>
 <option>Food</option>
 <option>Entertainment</option>
</select>

<label>🚀 Target views</label>

<select id="target">
 <option value="100000">100,000</option>
 <option value="500000">500,000</option>
 <option value="1000000" selected>1,000,000</option>
 <option value="5000000">5,000,000</option>
 <option value="10000000">10,000,000</option>
</select>

<div class="targetTitle">TARGET</div>
<div class="target" id="targetText">1,000,000</div>

<button class="boost" onclick="boost()">
 🚀 VIRAL BOOST
</button>

<div class="dashboard" id="dashboard">

<div class="status" id="status">
 ⚡ Boosting your content...
</div>

<div class="counter" id="counter">0</div>

<div class="viewsLabel">SIMULATED VIEWS</div>

<div class="bar">
 <div class="fill" id="fill"></div>
</div>

<div class="percent" id="percent">0%</div>

<div class="stats">

<div class="stat">
 <div class="num" id="speed">0</div>
 <div class="small">VIEWS / SEC</div>
</div>

<div class="stat">
 <div class="num" id="reach">0</div>
 <div class="small">EST. REACH</div>
</div>

</div>

<div class="complete" id="complete">
 <h2>🔥 1M VIEWS REACHED!</h2>
 <div>Your viral boost simulation is complete.</div>
</div>

<button class="reset" onclick="resetBoost()">
 🔄 NEW BOOST
</button>

</div>

</div>

</div>

<script>

const target=document.getElementById("target");
const targetText=document.getElementById("targetText");

target.addEventListener("change",()=>{
 targetText.textContent=
 Number(target.value).toLocaleString();
});

function boost(){

 const topic=document.getElementById("topic").value.trim();

 if(!topic){
  alert("Enter your video topic first.");
  return;
 }

 const goal=Number(target.value);

 document.getElementById("dashboard").style.display="block";
 document.getElementById("complete").style.display="none";

 let start=Date.now();
 let duration=6000;

 function animate(){

  let elapsed=Date.now()-start;
  let p=Math.min(elapsed/duration,1);

  let views=Math.floor(goal*p);

  document.getElementById("counter").textContent=
   views.toLocaleString();

  document.getElementById("fill").style.width=
   (p*100)+"%";

  document.getElementById("percent").textContent=
   Math.floor(p*100)+"%";

  let speed=Math.floor(goal/duration*1000);

  document.getElementById("speed").textContent=
   speed.toLocaleString();

  document.getElementById("reach").textContent=
   Math.floor(views*1.4).toLocaleString();

  if(p<1){
   requestAnimationFrame(animate);
  }else{

   document.getElementById("status").textContent=
    "✅ Boost simulation complete";

   document.getElementById("complete").style.display="block";
  }
 }

 animate();
}

function resetBoost(){

 document.getElementById("dashboard").style.display="none";

 document.getElementById("counter").textContent="0";
 document.getElementById("fill").style.width="0%";
 document.getElementById("percent").textContent="0%";

 document.getElementById("complete").style.display="none";

 document.getElementById("status").textContent=
  "⚡ Boosting your content...";
}

</script>

</body>
</html>
