<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViewBoost AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1020;
 color:white;
}
.app{
 max-width:600px;
 margin:auto;
 padding:22px;
}
.header{text-align:center;padding:20px 0}
.logo{font-size:34px;font-weight:800}
.sub{color:#aeb7d0;margin-top:8px}
.card{
 background:#151c32;
 border:1px solid #293452;
 border-radius:20px;
 padding:20px;
 margin:16px 0;
}
input,textarea,select{
 width:100%;
 padding:14px;
 margin:8px 0 14px;
 border-radius:12px;
 border:1px solid #35415f;
 background:#0e1528;
 color:white;
 font-size:16px;
}
textarea{min-height:100px}
label{font-weight:bold}
.boost{
 width:100%;
 padding:18px;
 border:0;
 border-radius:15px;
 background:#1877f2;
 color:white;
 font-size:20px;
 font-weight:800;
}
.target{
 text-align:center;
 font-size:46px;
 font-weight:900;
 margin:10px;
}
.result{
 display:none;
 margin-top:20px;
}
.item{
 background:#0e1528;
 padding:15px;
 border-radius:13px;
 margin:10px 0;
}
.title{
 font-weight:800;
 margin-bottom:7px;
}
.copy{
 background:#293657;
 border:0;
 color:white;
 padding:9px 12px;
 border-radius:8px;
 margin-top:8px;
}
.warning{
 color:#aeb7d0;
 font-size:12px;
 text-align:center;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">🚀 ViewBoost AI</div>
<div class="sub">Viral Content Booster</div>
</div>

<div class="card">

<label>What is your video about?</label>

<textarea id="topic"
placeholder="Example: How to check engine problems"></textarea>

<label>Your niche</label>

<select id="niche">
<option>Automotive</option>
<option>Technology</option>
<option>Beauty</option>
<option>Gaming</option>
<option>Food</option>
<option>Affiliate Marketing</option>
<option>Other</option>
</select>

<label>Target</label>

<div class="target">1,000,000</div>

<button class="boost" onclick="boost()">
🚀 VIRAL BOOST
</button>

</div>

<div class="card result" id="result">

<h2>🔥 Your 1M Views Strategy</h2>

<div class="item">
<div class="title">🪝 HOOK</div>
<div id="hook"></div>
<button class="copy" onclick="copyText('hook')">Copy</button>
</div>

<div class="item">
<div class="title">🎬 VIDEO IDEA</div>
<div id="idea"></div>
<button class="copy" onclick="copyText('idea')">Copy</button>
</div>

<div class="item">
<div class="title">📝 CAPTION</div>
<div id="caption"></div>
<button class="copy" onclick="copyText('caption')">Copy</button>
</div>

<div class="item">
<div class="title">#️⃣ HASHTAGS</div>
<div id="hashtags"></div>
<button class="copy" onclick="copyText('hashtags')">Copy</button>
</div>

<div class="item">
<div class="title">📈 VIRAL CHECKLIST</div>
<div id="checklist"></div>
</div>

</div>

<div class="warning">
ViewBoost AI helps optimize content for real viewers.
</div>

</div>

<script>

function boost(){

let topic=document.getElementById("topic").value.trim();
let niche=document.getElementById("niche").value;

if(!topic){
alert("Enter your video topic first.");
return;
}

let hooks={
"Automotive":
"🚨 STOP! Don't replace that part until you check THIS first!",
"Technology":
"Most people don't know this simple trick...",
"Beauty":
"Wait! Don't buy another product until you see this.",
"Gaming":
"99% of players don't know this trick!",
"Food":
"You've probably been doing this wrong your whole life!",
"Affiliate Marketing":
"Before you buy this, watch this first!",
"Other":
"STOP SCROLLING! You need to see this!"
};

let hook=hooks[niche] || hooks["Other"];

let idea=
"Start with the most surprising part of \""+
topic+"\" immediately. Show the result first, then explain how you achieved it.";

let caption=
"🔥 "+topic+
" — would you try this? Watch until the end and tell me what you think. Follow for more "+niche+" tips!";

let hashtags=
"#"+niche.replace(/\s/g,"")+
" #ViralReels #FacebookReels #Trending #Tips #MustWatch";

let checklist=
"✅ Strong first 2 seconds<br>"+
"✅ Show the result early<br>"+
"✅ Remove unnecessary intro<br>"+
"✅ Use clear on-screen text<br>"+
"✅ End with a question<br>"+
"✅ Test multiple hooks<br>"+
"✅ Track retention and shares";

document.getElementById("hook").innerText=hook;
document.getElementById("idea").innerText=idea;
document.getElementById("caption").innerText=caption;
document.getElementById("hashtags").innerText=hashtags;
document.getElementById("checklist").innerHTML=checklist;

document.getElementById("result").style.display="block";

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function copyText(id){

let text=document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

alert("Copied!");
}

</script>

</body>
</html>
